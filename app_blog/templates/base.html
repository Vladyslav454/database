<!DOCTYPE html>
<html lang="uk">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Персональний блог{% endblock %}</title>
    <!-- Bootstrap CSS та власний main.css -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

<div class="container py-3">
    <!-- Шапка сайту -->
    <header class="site-header d-flex align-items-center justify-content-between">
        <a href="/" class="text-decoration-none">
            <h1 class="site-title h3">Персональний блог</h1>
        </a>
    </header>

    <!-- Основний блок-підкладка з білим фоном для читабельності -->
    <main class="content-wrapper">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center text-white-50 pb-4">
        <small>&copy; {% now "Y" %} Персональний блог на Django</small>
    </footer>
</div>

<!-- JavaScripts -->
<script src="{% static 'js/jquery.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
